<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/magapp.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magasin d'Applications - Ivry-sur-Seine</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash clair/sombre.
      (function () {
        try {
          var t = localStorage.getItem('ui-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <style>
      /* ───────────────────────────────────────────────────────────
         Fond posé dans le <head> et pas seulement dans index.css : le
         CSS du bundle arrive avec le JS, donc le navigateur peint son
         fond BLANC par défaut pendant tout le chargement des modules —
         c'est cet éclair qu'on voit en mode sombre. En mode sombre le
         fond reste blanc SUR LE PLAN CSS : c'est le filter: invert(1)
         de <html> qui le transforme en noir, comme le reste de l'UI.
         ─────────────────────────────────────────────────────────── */
      html { background-color: #ffffff; }
      html[data-theme="dark"] {
        filter: invert(1) hue-rotate(180deg);
        background-color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
