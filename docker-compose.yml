version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appdsi-backend
    ports:
      # Mappe le port 3001 du conteneur vers le port 3001 de l'hôte Proxmox
      - "3001:3001"
    extra_hosts:
      # Le conteneur Linux (réseau bridge) ne résout pas le nom NetBIOS court
      # "nas-syno05" comme le fait Windows via le DNS AD (ivry.local).
      # On mappe explicitement le nom du filer SMB vers son IP pour que
      # l'accès au partage UNC (\\nas-syno05\editions$\DSIHUB) fonctionne.
      - "nas-syno05:10.103.131.136"
      # Idem pour le serveur Sedit Finances : le partage des pièces jointes
      # factures (\\seditgf-prod\editions$\SMPROD\eGF\pjust) est introuvable
      # depuis le conteneur sans ce mapping, ce qui remonte à tort comme
      # "Fichier introuvable ou accès refusé".
      - "seditgf-prod:10.103.130.72"
    environment:
      # Fuseau horaire : le backend lit/écrit des timestamps naïfs (timestamp
      # without time zone). On force Europe/Paris pour que node-pg interprète
      # ces dates comme l'heure de Paris (et non UTC en conteneur), cohérent
      # avec les données GLPI et l'affichage.
      - TZ=Europe/Paris
      # PostgreSQL externe (10.103.130.106)
      - POSTGRES_HOST=10.103.130.106
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ivry_admin
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ivrypassword}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey}
      # Utilisée UNIQUEMENT par l'aperçu OnlyOffice (previewExplorerOnlyOffice) pour
      # que le conteneur "documentserver" récupère le fichier à afficher en direct,
      # via le réseau Docker interne — jamais par le certificat auto-signé du
      # domaine public (dsihub.ivry.local), que le moteur ne peut pas valider.
      # Ne PAS confondre avec APP_BASE_URL (liens publics dans les emails/tâches).
      - ONLYOFFICE_CALLBACK_URL=http://backend:3001
      # Base des liens de signature (e-mail) et du QR code de vérification : domaine public
      # du parapheur. Repli si le réglage SQLite `parapheur.public_base_url` est vide
      # (réglage prioritaire, modifiable dans /admin/parapheur-certificats).
      - PARAPHEUR_PUBLIC_URL=${PARAPHEUR_PUBLIC_URL:-https://parapheur.ivry94.fr}
    volumes:
      # Dossiers de fichiers persistés
      - ./backend/uploads:/app/uploads
      - ./backend/file_commandes:/app/file_commandes
      - ./backend/file_factures:/app/file_factures
      - ./backend/file_certif:/app/file_certif
      - ./backend/file_telecom:/app/file_telecom
      - ./backend/magapp_img:/app/magapp_img
      # Base de données SQLite persistée
      - ./backend/data:/app/data
      # Dossier de logs pour éviter les conflits de montage de fichiers inexistants
      - ./backend/logs:/app/logs
    networks:
      - app-network
    # Redémarre automatiquement le conteneur sauf s'il est explicitement arrêté
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appdsi-frontend
    ports:
      # Mappe le port 5173 du conteneur (configuré dans nginx.conf) vers le port 5173 de l'hôte
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  magapp-frontend:
    build:
      context: ./magapp-frontend
      dockerfile: Dockerfile
    container_name: appdsi-magapp-frontend
    ports:
      - "5174:5174"
    environment:
      - BACKEND_URL=http://backend:3001
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  chat-frontend:
    build:
      context: ./chat-frontend
      dockerfile: Dockerfile
    container_name: appdsi-chat-frontend
    ports:
      - "5175:5175"
    environment:
      - BACKEND_URL=http://backend:3001
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # Serveur de documents (aperçu docx/xlsx/pptx dans l'explorateur de /projets).
  # Dédié à AppDSI — ne pas confondre avec le "delib-documentserver-1" du projet
  # delib (autre conteneur, autre secret JWT, sur le même hôte Docker).
  #
  # AUCUN port publié, et c'est voulu : le frontal (frontend/nginx.conf, bloc
  # `location /onlyoffice/`) relaie ce service sous le même nom d'hôte que
  # l'application (https://dsihub.ivry.local/onlyoffice), donc en HTTPS sans
  # contenu mixte. Publier son port exposerait en HTTP un moteur qu'une page
  # HTTPS charge — le navigateur bloquerait ça comme contenu mixte (cf. le
  # même choix documenté dans C:\dev\delib\docker-compose.yml).
  #
  # Version épinglée sur une branche de correctifs (« 9.4 » = tous les 9.4.x) :
  # la balise flottante « latest » ferait monter la version majeure sans
  # contrôle ni test — même précaution que delib.
  documentserver:
    image: onlyoffice/documentserver:9.4
    container_name: appdsi-documentserver
    restart: unless-stopped
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:?secret JWT OnlyOffice requis (variable ONLYOFFICE_JWT_SECRET, cf. .env non versionné sur l'hôte)}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    volumes:
      - appdsi-officecache:/var/www/onlyoffice/Data
      - appdsi-officelogs:/var/log/onlyoffice
    networks:
      - app-network
    depends_on:
      - backend
    # Démarrage lent (migration de base interne au premier lancement) :
    # prévoir quelques minutes avant le premier aperçu.

networks:
  # Définit un réseau commun pour que les conteneurs puissent communiquer entre eux
  app-network:
    driver: bridge

volumes:
  appdsi-officecache:
  appdsi-officelogs:
