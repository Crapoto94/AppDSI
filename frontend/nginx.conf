# L'en-tête Connection ne doit valoir « upgrade » que pour le WebSocket de
# l'éditeur OnlyOffice — envoyé sans Upgrade correspondant, il casse le
# keep-alive des requêtes ordinaires (chargement de api.js, XHR de l'éditeur).
# Cf. C:\dev\delib\frontend\nginx.conf (même problème résolu en prod).
map $http_upgrade $onlyoffice_connection {
    default upgrade;
    ''      close;
}

server {
    listen 5173;
    server_name localhost;
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Gérer le routage React/Vite (si une route n'est pas un fichier, renvoyer index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le moteur OnlyOffice dédié à AppDSI (service "documentserver" du
    # docker-compose, aucun port publié — cf. docker-compose.yml) — aperçu
    # docx/xlsx/pptx de /projets. Le SDK OnlyOffice s'exécute dans le navigateur
    # de l'agent et doit joindre le moteur EN DIRECT (script, iframe, websocket),
    # ce n'est donc jamais un simple appel /api relayé par le backend.
    #
    # Mêmes en-têtes que C:\dev\delib\frontend\nginx.conf (bureau en ligne déjà
    # opérationnel en prod là-bas, avec exactement cette topologie) :
    # - Le préfixe est retiré EXPLICITEMENT par `rewrite` : avec une variable ou
    #   un hôte sans chemin dans `proxy_pass`, nginx transmet l'URI telle quelle
    #   et le moteur reçoit "/onlyoffice/healthcheck" au lieu de "/healthcheck".
    # - X-Forwarded-Proto est FIXÉ à https (jamais $scheme) : le proxy qui
    #   termine le TLS devant ce conteneur relaie en HTTP jusqu'ici, donc
    #   $scheme vaudrait "http" et le moteur annoncerait ses propres URL en
    #   http — bloquées par le navigateur comme contenu mixte.
    # - X-Forwarded-Host porte l'hôte ET le préfixe (le moteur s'en sert pour
    #   fabriquer ses URL absolues sous /onlyoffice) ; X-Forwarded-Prefix doit
    #   rester VIDE sinon le moteur ajoute le préfixe deux fois.
    location /onlyoffice/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $documentserver documentserver:80;
        rewrite ^/onlyoffice/?(.*)$ /$1 break;
        proxy_pass http://$documentserver;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host/onlyoffice;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $onlyoffice_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Proxy Socket.io (WebSocket + polling) — doit être avant /api/
    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Rediriger toutes les requêtes /api vers le container du backend (qui s'appelle 'backend' dans docker-compose)
    # Proxy pour les requêtes API vers le backend Docker
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sans ceci, nginx coupe la connexion après son défaut de 60s — trop
        # court pour certains appels /api longs (ex. génération de résumé de
        # réunion via IA, qui peut prendre plusieurs minutes selon le modèle/
        # fournisseur). Le backend attend lui-même jusqu'à 25 min (cf.
        # shared/apm_ai.js) : on reste large ici pour ne pas redevenir le
        # goulot d'étranglement une fois ce timeout relevé.
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        # Debug headers
        add_header X-Proxy-Target http://backend:3001 always;
    }

    # Rediriger également l'accès aux dossiers de fichiers (uploads, file_commandes, etc.) vers le backend
    location /mouchard {
        proxy_pass http://backend:3001/mouchard;
    }
    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
    }
    location /file_commandes/ {
        proxy_pass http://backend:3001/file_commandes/;
    }
    location /file_factures/ {
        proxy_pass http://backend:3001/file_factures/;
    }
    location /file_certif/ {
        proxy_pass http://backend:3001/file_certif/;
    }
    location /img/ {
        proxy_pass http://backend:3001/img/;
    }
    # Stockage unifié (GED) — server.js:460 monte app.use('/storage', ...) sans ce
    # bloc, /storage/* tombe dans le fallback SPA et renvoie index.html au lieu du
    # fichier (constaté sur les téléchargements depuis /admin/ged : 453 octets de HTML).
    location /storage/ {
        proxy_pass http://backend:3001/storage/;
    }
}
